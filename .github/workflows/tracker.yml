name: Cita Previa Tracker

on:
  schedule:
    # GitHub schedules can be delayed during busy periods.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cita-previa-tracker
  cancel-in-progress: true

jobs:
  check-appointments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      NIE: ${{ secrets.NIE }}
      FULL_NAME: ${{ secrets.FULL_NAME }}
      PROCEDURE_TEXT: "POLICÍA-TOMA DE HUELLAS (EXPEDICIÓN DE TARJETA) INICIAL, RENOVACIÓN, DUPLICADO Y LEY 14/2013"
      PROVINCE_CODE: "48"
      NATIONALITY: "MARRUECOS"
      ALWAYS_NOTIFY: "true"
      PROXY_SERVER: ${{ secrets.PROXY_SERVER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          playwright install --with-deps chromium

      - name: Check appointments
        run: python scraper.py

      - name: Upload diagnostics on failure or availability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icpplus-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3
